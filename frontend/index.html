<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCESI - Control de Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center text-indigo-700 mb-8">
      Control de Acceso
    </h1>

    <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
      <h2 class="text-2xl font-semibold mb-6 text-center">Registrar Acceso</h2>
      
      <div class="space-y-4">
        <input type="text" id="carnet" 
               class="w-full px-4 py-3 border border-gray-300 rounded-xl text-lg focus:outline-none focus:border-indigo-500"
               placeholder="Ingresa el número de carnet" autofocus>

        <select id="tipo_acceso" class="w-full px-4 py-3 border border-gray-300 rounded-xl text-lg">
          <option value="entrada">Entrada</option>
          <option value="salida">Salida</option>
        </select>

        <button onclick="registrarAcceso()" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl text-xl transition">
          <i class="fas fa-qrcode mr-2"></i> Registrar Acceso
        </button>
      </div>
    </div>

    
    <div id="resultado" class="hidden mt-6 p-6 rounded-2xl text-center"></div>
  </div>

  <script>
    async function registrarAcceso() {
      const carnet = document.getElementById('carnet').value.trim();
      const tipo = document.getElementById('tipo_acceso').value;
      const resultadoDiv = document.getElementById('resultado');

      if (!carnet) {
        alert("Por favor ingresa un número de carnet");
        return;
      }

      resultadoDiv.classList.remove('hidden');

      try {
        const response = await fetch('http://127.0.0.1:8000/api/seguridad/acceso/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carnet: carnet, tipo_acceso: tipo })
        });

        const data = await response.json();

        if (response.ok && data.mensaje.includes("correctamente")) {
          resultadoDiv.innerHTML = `
            <div class="bg-green-100 border border-green-500 text-green-700 p-6 rounded-2xl">
              <i class="fas fa-check-circle text-5xl mb-4"></i>
              <p class="text-2xl font-semibold">${data.mensaje}</p>
              <p class="mt-2">${data.data.estudiante_nombre || 'Estudiante'} - ${data.data.estado}</p>
            </div>`;
        } else {
          resultadoDiv.innerHTML = `
            <div class="bg-red-100 border border-red-500 text-red-700 p-6 rounded-2xl">
              <i class="fas fa-times-circle text-5xl mb-4"></i>
              <p class="text-2xl font-semibold">${data.mensaje}</p>
            </div>`;
        }
      } catch (error) {
        resultadoDiv.innerHTML = `
          <div class="bg-red-100 text-red-700 p-6 rounded-2xl">
            Error de conexión con el backend
          </div>`;
      }
    }

    document.getElementById('carnet').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') registrarAcceso();
    });
  </script>
</body>
</html>
